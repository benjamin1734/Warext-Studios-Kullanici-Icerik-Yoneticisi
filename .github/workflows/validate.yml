name: XenForo Add-on Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Resolve version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('upload/src/addons/WarextStudios/UserContentManager/addon.json', encoding='utf-8'))['version_string'])")
          echo "ADDON_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: PHP syntax
        run: find upload/src/addons/WarextStudios/UserContentManager -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JSON and XML
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path('upload/src/addons/WarextStudios/UserContentManager')
          for path in sorted(root.rglob('*.json')):
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
          for path in sorted((root / '_data').glob('*.xml')):
              ET.parse(path)
          PY
      - name: Runtime short names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('upload/src/addons/WarextStudios/UserContentManager')
          files = [
              root / 'Pub/Controller/ActionHistory.php',
              root / 'Service/ActionLogger.php',
              root / 'Service/BulkOperationQueue.php',
              root / 'Entity/ActionLog.php',
              root / 'Entity/BulkOperation.php',
              root / 'Job/BulkOperationFinal2.php'
          ]
          bad = 'WarextStudios/UserContentManager:'
          for path in files:
              if bad in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'Invalid XenForo short name in {path}')
          routes = (root / '_data/routes.xml').read_text(encoding='utf-8')
          if 'UserContentFinalCompat' not in routes or 'ResourceContentFinalCompat' not in routes:
              raise SystemExit('Compatibility controllers are not active in routes.xml')
          PY
      - name: Required files
        run: |
          test -f upload/src/addons/WarextStudios/UserContentManager/addon.json
          test -f upload/src/addons/WarextStudios/UserContentManager/Setup.php
          test -f upload/src/addons/WarextStudios/UserContentManager/XF/Entity/User.php
          test -f upload/src/addons/WarextStudios/UserContentManager/_data/class_extensions.xml
          test -f upload/src/addons/WarextStudios/UserContentManager/Admin/Controller/UserContentAdmin.php
          test -f upload/src/addons/WarextStudios/UserContentManager/Job/BulkOperationFinal2.php
          test -f upload/src/addons/WarextStudios/UserContentManager/Pub/Controller/UserContentFinal.php
          test -f upload/src/addons/WarextStudios/UserContentManager/Pub/Controller/ResourceContentFinal.php
          test -f upload/src/addons/WarextStudios/UserContentManager/Pub/Controller/UserContentFinalCompat.php
          test -f upload/src/addons/WarextStudios/UserContentManager/Pub/Controller/ResourceContentFinalCompat.php
          test -f upload/src/addons/WarextStudios/UserContentManager/_data/admin_navigation.xml
      - name: Build XenForo install archive
        if: matrix.php == '8.4'
        run: |
          rm -rf build
          mkdir -p build releases
          cp -a upload build/upload
          rm -rf build/upload/src/addons/WarextStudios/UserContentManager/_output
          rm -rf build/upload/src/addons/WarextStudios/UserContentManager/_releases
          rm -rf build/upload/src/addons/WarextStudios/UserContentManager/_build
          rm -rf build/upload/src/addons/WarextStudios/UserContentManager/_repo
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          upload_root = pathlib.Path('build/upload')
          addon_root = upload_root / 'src/addons/WarextStudios/UserContentManager'
          hashes = {}
          for path in sorted(addon_root.rglob('*')):
              if not path.is_file() or path.name == 'hashes.json':
                  continue
              rel = path.relative_to(upload_root).as_posix()
              hashes[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          (addon_root / 'hashes.json').write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY
          rm -f "releases/WarextStudios-UserContentManager-${ADDON_VERSION}.zip"
          (cd build && zip -qr "../releases/WarextStudios-UserContentManager-${ADDON_VERSION}.zip" upload)
          unzip -Z1 "releases/WarextStudios-UserContentManager-${ADDON_VERSION}.zip" | grep -qx 'upload/src/addons/WarextStudios/UserContentManager/addon.json'
          unzip -Z1 "releases/WarextStudios-UserContentManager-${ADDON_VERSION}.zip" | grep -qx 'upload/src/addons/WarextStudios/UserContentManager/hashes.json'
          if unzip -Z1 "releases/WarextStudios-UserContentManager-${ADDON_VERSION}.zip" | grep -q '/_output/'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: WarextStudios-UserContentManager-${{ env.ADDON_VERSION }}
          path: releases/WarextStudios-UserContentManager-${{ env.ADDON_VERSION }}.zip
          if-no-files-found: error
      - name: Create or update GitHub Release
        if: matrix.php == '8.4' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${ADDON_VERSION}"
          FILE="releases/WarextStudios-UserContentManager-${ADDON_VERSION}.zip"
          cat > /tmp/release-notes.md <<'EOF'
# Warext Studios | Kullanıcı İçerik Yöneticisi

XenForo 2.3 için kullanıcıların oluşturduğu içerikleri kategori ve içerik türüne göre görüntülemek, filtrelemek ve yetkiye bağlı olarak toplu yönetmek amacıyla geliştirilen moderasyon eklentisi.

- Kullanıcı içerik yönetim merkezi
- Konu kategori gruplaması ve gelişmiş filtreleme
- Tekli, sayfa, kategori ve tüm filtre sonucu seçimi
- Toplu taşıma, silme, kalıcı silme, geri getirme, kilit ve sabitleme
- Toplu onay, önek ve başlık düzenleme
- XenForo native permission yeniden doğrulaması ve moderator log entegrasyonu
- XenForo Resource Manager için opsiyonel entegrasyon
- 500 üzeri işlemlerde XenForo Job sistemi ve cursor tabanlı batch işleme

Kurulum ZIP'i XenForo Admin CP > Add-ons > Install/upgrade from archive alanına doğrudan yüklenebilir.

---

## English

# Warext Studios | User Content Manager

A moderation add-on for XenForo 2.3 designed to view, filter and permission-gated bulk-manage content created by a user, grouped by content type and category.

- User content management center
- Thread category grouping and advanced filtering
- Single-item, page, category and entire filtered-result selection
- Bulk move, delete, permanent delete, restore, lock and sticky actions
- Bulk approval, prefix and title editing
- XenForo-native permission revalidation and moderator-log integration
- Optional XenForo Resource Manager integration
- XenForo Job processing with cursor-based batches for operations above 500 items

The installation ZIP can be uploaded directly through XenForo Admin CP > Add-ons > Install/upgrade from archive.
EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Warext Studios | Kullanıcı İçerik Yöneticisi ${ADDON_VERSION}" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "Warext Studios | Kullanıcı İçerik Yöneticisi ${ADDON_VERSION}" --notes-file /tmp/release-notes.md
          fi
